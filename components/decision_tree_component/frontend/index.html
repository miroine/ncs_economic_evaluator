<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#0e1117;color:#fafafa;font:14px system-ui}#bar{height:48px;padding:8px;display:flex;gap:7px;align-items:center;border-bottom:1px solid #333}button{padding:6px 9px;background:#262b33;color:white;border:1px solid #555;border-radius:6px;cursor:pointer}.hint{font-size:11px;color:#aeb6c2}.status{margin-left:auto;font-size:11px;color:#9ca6b5}#canvas{height:630px;position:relative;overflow:hidden;background-image:radial-gradient(#333 1px,transparent 1px);background-size:20px 20px}.node{position:absolute;width:160px;padding:9px;border:2px solid #7b8494;border-radius:9px;background:#1c2129;cursor:move;z-index:2;box-shadow:0 3px 12px #0008}.chance{border-radius:45px}.outcome{border-color:#57a773}.decision{border-color:#6d9eeb}.node.selected{outline:2px solid #f2c94c}.node input,.node select{width:100%;margin-top:5px;background:#11151a;color:white;border:1px solid #555;border-radius:4px;padding:3px}.small{font-size:10px;color:#aeb6c2;margin-top:4px}.edge-label{position:absolute;z-index:3;background:#11151a;border:1px solid #555;border-radius:5px;padding:3px 5px;font-size:10px}.edge-label input{width:50px;background:#11151a;color:#fff;border:0}.edge-label button{padding:0 4px;border:0;background:transparent;color:#e88}.good{color:#57a773}.warn{color:#f2c94c}</style></head><body>
<div id="bar"><button onclick="add('decision')">+ Decision</button><button onclick="add('chance')">+ Chance</button><button onclick="add('outcome')">+ Outcome</button><button onclick="autoLayout()">Auto layout</button><button onclick="deleteSelected()">Delete</button><span class="hint">Shift-click source → target to connect</span><span id="status" class="status"></span></div><div id="canvas"></div>
<script>
const themeStyle=document.createElement('style');themeStyle.textContent=`
body{background:var(--panel);color:var(--text)}
#bar{border-color:var(--grid)}#canvas{background-image:radial-gradient(var(--grid) 1px,transparent 1px)}
button,.node{background:var(--card);color:var(--text);border-color:var(--grid)}
.node{box-shadow:0 2px 6px #0001}.decision{border-color:var(--accent)}.outcome{border-color:var(--accent2)}
.node input,.node select,.edge-label,.edge-label input{background:var(--panel);color:var(--text);border-color:var(--grid)}
.small,.hint,.status{color:var(--muted)}.good{color:var(--accent)}.warn{color:#b45309}
`;document.head.appendChild(themeStyle);
const c=document.getElementById('canvas'),status=document.getElementById('status');let nodes=[],edges=[],seq=0,source=null,selected=null,scenarioValues={},moneyUnit='MNOK',moneyFactor=1;
function send(type,payload={}){parent.postMessage({isStreamlitMessage:true,type,...payload},'*')}
function changed(){send('streamlit:setComponentValue',{value:{nodes,edges},dataType:'json'});renderStatus()}
function ready(){send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:700})}
window.addEventListener('message',e=>{if(e.data?.type!=='streamlit:render')return;let a=e.data.args||{};if(a.value){nodes=JSON.parse(JSON.stringify(a.value.nodes||[]));edges=JSON.parse(JSON.stringify(a.value.edges||[]));seq=Math.max(0,...nodes.map(n=>parseInt(String(n.id).replace(/\D/g,''))||0))}scenarioValues=a.scenario_values||{};moneyUnit=a.money_unit||'MNOK';moneyFactor=a.money_factor||1;let theme={panel:'#f3f5f7',card:'#ffffff',text:'#051c2c',muted:'#526575',grid:'#dce3e8',accent:'#005eb8',accent2:'#00a1c9',...a.theme};for(let k of ['panel','card','text','muted','grid','accent','accent2'])document.documentElement.style.setProperty('--'+k,theme[k]);render()});
function add(type,x=70+(seq%5)*45,y=70+(seq%6)*45){let n={id:'n'+(++seq),type,x,y,label:type==='decision'?'Decision':type==='chance'?'Chance event':'Outcome',value:0,scenario_key:''};nodes.push(n);selected=n.id;changed();render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){c.innerHTML='';nodes.forEach(n=>{let d=document.createElement('div');d.className='node '+n.type+(selected===n.id?' selected':'');d.style.left=n.x+'px';d.style.top=n.y+'px';d.dataset.id=n.id;let scenario=n.scenario_key||'';let live=scenarioValues[scenario];d.innerHTML=`<b>${n.type.toUpperCase()}</b><input class="label" value="${esc(n.label)}"><div class=small>${n.type==='outcome'?'Scenario key / fallback NPV ('+esc(moneyUnit)+')':'Shift-click to connect'}</div>${n.type==='outcome'?`<input class="scenario" value="${esc(scenario)}" placeholder="Scenario name"><input class="value" type=number step=any value="${Number(n.value||0)*moneyFactor}"><div class="small ${live!==undefined?'good':''}">${live!==undefined?'Live NPV: '+Number(live).toLocaleString(undefined,{maximumFractionDigits:2})+' '+esc(moneyUnit):'Using fallback value ('+esc(moneyUnit)+')'}</div>`:''}`;
let ox,oy;d.onpointerdown=e=>{selected=n.id;if(e.shiftKey){e.preventDefault();if(!source){source=n.id;status.textContent='Connect from '+n.label}else if(source!==n.id){edges.push({id:'e'+Date.now(),source,target:n.id,probability:1,label:''});source=null;changed();render()}return}if(e.target.tagName==='INPUT')return;ox=e.clientX-n.x;oy=e.clientY-n.y;d.setPointerCapture(e.pointerId);d.onpointermove=q=>{n.x=Math.max(0,q.clientX-ox);n.y=Math.max(0,q.clientY-oy-48);d.style.left=n.x+'px';d.style.top=n.y+'px';drawEdges()};d.onpointerup=()=>{d.onpointermove=null;changed()}};
let label=d.querySelector('.label');label.onchange=e=>{n.label=e.target.value;changed()};let sc=d.querySelector('.scenario');if(sc)sc.onchange=e=>{n.scenario_key=e.target.value;changed();render()};let val=d.querySelector('.value');if(val)val.onchange=e=>{n.value=+e.target.value/moneyFactor;changed()};c.appendChild(d)});drawEdges();renderStatus()}
function drawEdges(){document.getElementById('svg')?.remove();document.querySelectorAll('.edge-label').forEach(x=>x.remove());let s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.id='svg';s.style='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1';edges.forEach((e,idx)=>{let a=nodes.find(n=>n.id===e.source),b=nodes.find(n=>n.id===e.target);if(!a||!b)return;let x1=a.x+80,y1=a.y+45,x2=b.x+80,y2=b.y+45;let l=document.createElementNS(s.namespaceURI,'line');for(let [k,v] of Object.entries({x1,y1,x2,y2,stroke:'#8b95a5','stroke-width':2}))l.setAttribute(k,v);s.appendChild(l);let lab=document.createElement('div');lab.className='edge-label';lab.style.left=((x1+x2)/2-35)+'px';lab.style.top=((y1+y2)/2-12)+'px';let parent=nodes.find(n=>n.id===e.source);lab.innerHTML=`${parent?.type==='chance'?`p=<input type=number min=0 max=1 step=.05 value="${Number(e.probability??0)}">`:`<input value="${esc(e.label||'')}" placeholder="branch">`} <button title="delete">×</button>`;let inp=lab.querySelector('input');inp.onchange=q=>{if(parent?.type==='chance')e.probability=+q.target.value;else e.label=q.target.value;changed()};lab.querySelector('button').onclick=()=>{edges.splice(idx,1);changed();render()};c.appendChild(lab)});c.prepend(s)}
function renderStatus(){let bad=[];nodes.filter(n=>n.type==='chance').forEach(n=>{let es=edges.filter(e=>e.source===n.id),sum=es.reduce((x,e)=>x+Number(e.probability||0),0);if(es.length&&Math.abs(sum-1)>.0001)bad.push(`${n.label}: p=${sum.toFixed(2)}`)});status.innerHTML=bad.length?`<span class=warn>${bad.join(' • ')}</span>`:`<span class=good>Tree synced</span>`}
function deleteSelected(){if(!selected)return;nodes=nodes.filter(n=>n.id!==selected);edges=edges.filter(e=>e.source!==selected&&e.target!==selected);selected=null;changed();render()}
function autoLayout(){let incoming=new Set(edges.map(e=>e.target)),roots=nodes.filter(n=>!incoming.has(n.id));let levels=[],seen=new Set(),q=roots.map(n=>[n.id,0]);while(q.length){let [id,l]=q.shift();if(seen.has(id))continue;seen.add(id);(levels[l]??=[]).push(id);edges.filter(e=>e.source===id).forEach(e=>q.push([e.target,l+1]))}nodes.filter(n=>!seen.has(n.id)).forEach(n=>(levels[0]??=[]).push(n.id));levels.forEach((ids,l)=>ids.forEach((id,i)=>{let n=nodes.find(x=>x.id===id);n.x=40+l*240;n.y=40+i*135}));changed();render()}
ready();
</script></body></html>
