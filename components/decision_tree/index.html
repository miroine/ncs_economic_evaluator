<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0e1117;color:#fafafa;font:14px system-ui}#bar{padding:10px;display:flex;gap:8px;border-bottom:1px solid #333}button{padding:7px 10px;background:#262b33;color:white;border:1px solid #555;border-radius:6px}#canvas{height:650px;position:relative;overflow:hidden;background-image:radial-gradient(#333 1px,transparent 1px);background-size:20px 20px}.node{position:absolute;width:130px;padding:10px;border:1px solid #7b8494;border-radius:8px;background:#1c2129;cursor:move}.chance{border-radius:60px}.outcome{border-color:#57a773}.node input{width:95%;margin-top:5px;background:#11151a;color:white;border:1px solid #555}.small{font-size:11px;color:#aeb6c2}</style></head><body>
<div id="bar"><button onclick="add('decision')">+ Decision</button><button onclick="add('chance')">+ Chance</button><button onclick="add('outcome')">+ Outcome</button><button onclick="exportTree()">Export JSON</button><span class="small">Drag nodes. Shift-click source then target to connect.</span></div><div id="canvas"></div>
<script>
const c=document.getElementById('canvas');let nodes=[],edges=[],seq=0,source=null;
function add(type,x=80+seq*35,y=70+seq*25){let n={id:'n'+(++seq),type,x,y,label:type==='decision'?'Decision':type==='chance'?'Chance event':'Outcome',value:0};nodes.push(n);render()}
function render(){c.innerHTML=''; nodes.forEach(n=>{let d=document.createElement('div');d.className='node '+n.type;d.style.left=n.x+'px';d.style.top=n.y+'px';d.dataset.id=n.id;d.innerHTML=`<b>${n.type.toUpperCase()}</b><input value="${n.label}"><div class=small>${n.type==='outcome'?'Value / NPV':'Shift-click to connect'}</div>${n.type==='outcome'?`<input type=number value="${n.value}">`:''}`; let ox,oy;d.onpointerdown=e=>{if(e.shiftKey){if(!source)source=n.id;else if(source!==n.id){edges.push({source,target:n.id,probability:1});source=null;drawEdges()}return} ox=e.clientX-n.x;oy=e.clientY-n.y;d.setPointerCapture(e.pointerId);d.onpointermove=q=>{n.x=q.clientX-ox;n.y=q.clientY-oy;d.style.left=n.x+'px';d.style.top=n.y+'px';drawEdges()};d.onpointerup=()=>d.onpointermove=null};let ins=d.querySelectorAll('input');ins[0].onchange=e=>n.label=e.target.value;if(ins[1])ins[1].onchange=e=>n.value=+e.target.value;c.appendChild(d)});drawEdges()}
function drawEdges(){let old=document.getElementById('svg');if(old)old.remove();let s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.id='svg';s.style='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0';edges.forEach(e=>{let a=nodes.find(n=>n.id===e.source),b=nodes.find(n=>n.id===e.target);if(!a||!b)return;let l=document.createElementNS(s.namespaceURI,'line');l.setAttribute('x1',a.x+65);l.setAttribute('y1',a.y+30);l.setAttribute('x2',b.x+65);l.setAttribute('y2',b.y+30);l.setAttribute('stroke','#8b95a5');l.setAttribute('stroke-width','2');s.appendChild(l)});c.prepend(s)}
function exportTree(){let data=JSON.stringify({nodes,edges},null,2);navigator.clipboard.writeText(data);alert('Tree JSON copied to clipboard')}
add('decision',70,260);add('chance',300,160);add('outcome',540,80);add('outcome',540,280);edges=[{source:'n1',target:'n2',probability:1},{source:'n2',target:'n3',probability:.6},{source:'n2',target:'n4',probability:.4}];render();
</script></body></html>
